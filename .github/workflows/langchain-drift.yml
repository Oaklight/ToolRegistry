name: LangChain drift

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        langchain-core: ["0.3.*", "1.*"]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test,mcp,ptc]"
          pip install "langchain-core==${{ matrix.langchain-core }}"

      - name: Run compatibility tests
        run: |
          python -m pytest \
            tests/test_langchain_integration.py \
            tests/test_langchain_compat.py \
            tests/test_remote_naming.py -v

      - name: Report drift
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="LangChain drift detected for langchain-core ${{ matrix.langchain-core }} on Python ${{ matrix.python-version }}"
          body="Scheduled compatibility run failed for \`langchain-core==${{ matrix.langchain-core }}\` on Python ${{ matrix.python-version }}. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Exact title comparison: passing the title to `gh --search` routes
          # it through GitHub's tokenizer, where `0.3.*` may not match the
          # issue it was filed as.
          existing=$(gh issue list --state open --limit 200 --json number,title \
            | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' \
            | head -n 1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label bug --label area:integrations
          fi
