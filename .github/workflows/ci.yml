name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies for ty
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1

  # LangChain support is structural (no runtime dependency), so the main job
  # covers it with fakes and proves the package works without langchain-core.
  # This job additionally installs a real core to exercise BaseTool
  # compatibility on every PR; the scheduled langchain-drift workflow watches
  # the 0.3/1.x matrix.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test,mcp,ptc]"
          pip install websockets

      - name: Run tests
        run: python -m pytest tests/ -v

  test-langchain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test,mcp,ptc]"
          pip install "langchain-core>=1,<2"

      - name: Run LangChain integration tests
        run: |
          python -m pytest \
            tests/test_langchain_integration.py \
            tests/test_langchain_compat.py \
            tests/test_register_replace.py \
            tests/test_registration_filter.py \
            tests/test_remote_naming.py \
            tests/test_tool_source.py -v

