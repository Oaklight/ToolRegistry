name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies for ty
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1

  # LangChain support is structural (no runtime dependency).  The main job
  # installs a real langchain-core so the BaseTool compatibility tests run on
  # every PR; the scheduled langchain-drift workflow watches the 0.3/1.x
  # matrix.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test,mcp,ptc]"
          pip install websockets "langchain-core>=1,<2"

      - name: Run tests
        run: python -m pytest tests/ -v

