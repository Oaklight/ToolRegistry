name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies for ty
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test,mcp,ptc]"
          pip install websockets

      - name: Run tests
        run: python -m pytest tests/ -v

  # The LangChain extra is installed in its own job: with langchain_core
  # importable, the full suite can stall in the executor timeout and PTC
  # tests (see #311).  Running the LangChain code paths in isolation keeps
  # them covered in CI without exposing the rest of the suite to that
  # interaction.
  test-langchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test,mcp,ptc,langchain]"

      - name: Run LangChain integration tests
        run: |
          python -m pytest \
            tests/test_langchain_integration.py \
            tests/test_register_replace.py \
            tests/test_registration_filter.py \
            tests/test_remote_naming.py -v
